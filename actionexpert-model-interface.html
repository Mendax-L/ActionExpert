<div id="model-interface-map" role="img" aria-label="VLA料箱纠偏模型接口展开图">
<style>
#model-interface-map{font-family:system-ui,sans-serif;color:var(--foreground);max-width:1000px;margin:auto}
#model-interface-map h2{font-weight:500;margin:0 0 4px}#model-interface-map .sub{font-size:13px;color:var(--muted-foreground);margin-bottom:12px}
#model-interface-map svg{width:100%;height:auto;display:block}.area{fill:var(--muted);fill-opacity:.42;stroke:var(--border)}
.node{fill:var(--card);stroke:var(--border);stroke-width:1.4}.obs{fill:color-mix(in srgb,var(--blue) 13%,var(--card));stroke:var(--blue)}
.enc{fill:color-mix(in srgb,var(--purple) 13%,var(--card));stroke:var(--purple)}.core{fill:color-mix(in srgb,var(--green) 13%,var(--card));stroke:var(--green)}
.io{fill:color-mix(in srgb,var(--orange) 13%,var(--card));stroke:var(--orange)}.contract{fill:color-mix(in srgb,var(--yellow) 13%,var(--card));stroke:var(--yellow)}
text{fill:var(--foreground);font-size:14px}.small{font-size:12px;fill:var(--muted-foreground)}.title{font-size:15px;font-weight:500}
.arrow{stroke:var(--muted-foreground);stroke-width:2;fill:none;marker-end:url(#mi-a)}.shared{stroke:var(--viz-series-1);stroke-width:2;fill:none;stroke-dasharray:6 5}
</style>
<h2>模型接口展开图</h2><div class="sub">统一输入契约支撑训练与推理两条路径</div>
<svg viewBox="0 0 1000 700" aria-label="观测张量经过编码和条件融合进入Flow Matching策略，训练和推理共享契约与检查点">
<defs><marker id="mi-a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="var(--muted-foreground)"/></marker></defs>

<rect class="node obs" x="42" y="72" width="270" height="70" rx="10"/><text x="58" y="96">视觉张量</text><text class="small" x="58" y="117">images [B, O, H, W, 3]</text><text class="small" x="58" y="134">camera2 / front</text>
<rect class="node obs" x="365" y="72" width="270" height="70" rx="10"/><text x="381" y="96">状态张量</text><text class="small" x="381" y="117">state [B, O, 54]</text><text class="small" x="381" y="134">位姿 · 关节 · 接触</text>
<rect class="node obs" x="688" y="72" width="270" height="70" rx="10"/><text x="704" y="96">语言条件</text><text class="small" x="704" y="117">language [B, O, 12]</text><text class="small" x="704" y="134">原语 · 幅度 · 目标增量</text>

<rect class="area" x="18" y="185" width="964" height="210" rx="14"/><text class="title" x="40" y="215">B · 可替换编码器与统一条件接口</text>
<rect class="node enc" x="42" y="244" width="270" height="72" rx="10"/><text x="58" y="269">VisualEncoder</text><text class="small" x="58" y="290">ResNet-18 / Qwen3-VL vision</text><text class="small" x="58" y="307">→ visual feature [B, O, 256]</text>
<rect class="node enc" x="365" y="244" width="270" height="72" rx="10"/><text x="381" y="269">StateEncoder</text><text class="small" x="381" y="290">Identity / MLP</text><text class="small" x="381" y="307">→ state feature [B, O, D]</text>

<rect class="node core" x="260" y="340" width="480" height="38" rx="10"/><text x="276" y="365">condition = concat(visual, state, language) → [B, O, C]</text>

<rect class="area" x="18" y="415" width="964" height="133" rx="14"/><text class="title" x="40" y="445">C · Flow Matching Policy 核心接口</text>
<rect class="node core" x="42" y="470" width="220" height="56" rx="10"/><text x="58" y="494">compute_loss</text><text class="small" x="58" y="514">condition + action [B,16,3]</text>

<path class="arrow" d="M500 378V430C500 455 152 450 152 470M500 378V470M500 378V430C500 455 698 450 698 470M262 498H295M555 498H588"/>

<rect class="node io" x="836" y="620" width="122" height="42" rx="9"/><text x="852" y="638">execute</text><text class="small" x="852" y="654">replan · record</text>
<path class="arrow" d="M664 641H684M816 641H836"/>

<text class="small" x="406" y="695">共享：环境动作契约 · 标准化参数 · checkpoint 格式 · 观测历史长度</text>
</svg></div>
